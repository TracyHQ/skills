name: publish
on:
  push:
    branches: [main]
  schedule:
    # Daily cadence: stars, commit dates and contentHash can change with no PR opened here.
    - cron: '0 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs full history to derive submittedBy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs AFTER the build on purpose: the schema copy that reaches consumers is generated
      # into dist/skills/schema/, not written in a source file. Checking sources alone would
      # miss it.
      - name: Check the public surface is in English
        run: node scripts/check-language.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
